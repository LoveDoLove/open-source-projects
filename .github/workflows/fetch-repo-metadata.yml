name: Fetch Repo Metadata

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # daily

permissions:
  contents: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run metadata fetch script
        run: node scripts/fetchRepoMetadata.js

      - name: Replace previous auto-update commit and push
        env:
          UPDATE_BRANCH: main
          COMMIT_MESSAGE: "Update public/data/projects.json with latest repo metadata"
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          metadata_file=public/data/projects.json
          generated="${RUNNER_TEMP:-/tmp}/projects.json.generated"
          cp "${metadata_file}" "${generated}"

          # Nothing to publish: leave the branch alone instead of re-committing
          # identical content (which would churn a new commit every run).
          if git diff --quiet HEAD -- "${metadata_file}"; then
            echo "Metadata already matches HEAD, nothing to do"
            exit 0
          fi

          # The commit this run was based on. --force-with-lease compares against it,
          # so anything pushed after checkout is never overwritten.
          base=$(git rev-parse --verify --quiet "refs/remotes/origin/${UPDATE_BRANCH}" || git rev-parse HEAD)

          # Fold away our own previous metadata commit(s) so daily runs replace the
          # last automatic commit instead of stacking a new one every day.
          discarded=0
          while [ "${discarded}" -lt 5 ] \
            && [ "$(git log -1 --pretty=format:%ae)" = "github-actions[bot]@users.noreply.github.com" ] \
            && [ "$(git log -1 --pretty=format:%s)" = "${COMMIT_MESSAGE}" ] \
            && git rev-parse --verify --quiet HEAD~1 > /dev/null; do
            git reset --soft HEAD~1
            discarded=$((discarded + 1))
          done
          echo "Discarded ${discarded} previous auto-update commit(s)"
          if [ "${discarded}" -gt 0 ]; then
            # Restore every other file to the discarded commit's parent; only the
            # generated metadata file is allowed to change.
            git checkout HEAD -- .
          fi
          cp "${generated}" "${metadata_file}"

          git add "${metadata_file}"
          if git diff --cached --quiet; then
            echo "No metadata changes to commit"
            exit 0
          fi
          git commit -m "${COMMIT_MESSAGE}"

          if git push --force-with-lease="refs/heads/${UPDATE_BRANCH}:${base}" origin "HEAD:refs/heads/${UPDATE_BRANCH}"; then
            exit 0
          fi

          # The branch moved while this run held its copy. Replay the generated file on
          # the current tip and push normally instead of overwriting it. projects.json
          # is generated, so a hand edit to it loses by design; nothing else is touched.
          echo "Remote moved, replaying the generated metadata onto origin/${UPDATE_BRANCH}"
          git fetch origin "${UPDATE_BRANCH}"
          git reset --mixed "origin/${UPDATE_BRANCH}"
          cp "${generated}" "${metadata_file}"
          git add "${metadata_file}"
          if git diff --cached --quiet; then
            echo "Remote already has this metadata, nothing to push"
            exit 0
          fi
          git commit -m "${COMMIT_MESSAGE}"
          git push origin "HEAD:refs/heads/${UPDATE_BRANCH}"